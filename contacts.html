<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <!-- Подключение Bootstrap 5 CSS и Иконок -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .wrapper { flex: 1; display: flex; flex-wrap: nowrap; }
        .sidebar { width: 280px; min-height: 100vh; }
    </style>
</head>
<body class="bg-light">

    <!-- ХЕДЕР -->
    <header class="p-3 text-bg-dark border-bottom border-secondary">
        <div class="container-fluid d-flex flex-wrap align-items-center justify-content-between">
            <span class="fs-5 fw-semibold">Панель администратора</span>
            <div class="text-end">
                <span class="badge bg-success">Сервер активен</span>
            </div>
        </div>
    </header>

    <!-- ОСНОВНАЯ ЧАСТЬ -->
    <div class="wrapper">
        <!-- БОКОВОЕ МЕНЮ -->
        <div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark sidebar">
            <ul class="nav nav-pills flex-column mb-auto">
                <li><a href="#" class="nav-link text-white"><i class="bi bi-house-door me-2"></i>Главная</a></li>
                <li><a href="#" class="nav-link text-white"><i class="bi bi-grid me-2"></i>Категории</a></li>
                <li><a href="#" class="nav-link text-white"><i class="bi bi-cart3 me-2"></i>Заказы</a></li>
                <li><a href="#" class="nav-link active" aria-current="page"><i class="bi bi-person-lines-fill me-2"></i>Контакты</a></li>
            </ul>
        </div>

        <!-- КОНТЕНТ С ФОРМОЙ -->
        <main class="flex-grow-1 p-5 overflow-auto bg-white">
            <div class="container py-5">
                <h1 class="mb-4">Контакты</h1>

                <div class="row">
                    <div class="col-md-6">
                        <!-- Форма с нужными атрибутами (Пункт 1) -->
                        <form method="post" action="/contacts">
                            <div class="mb-3">
                                <label class="form-label" for="username">Имя</label>
                                <input class="form-control" id="username" name="username" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Почта</label>
                                <input class="form-control" id="email" name="email" type="email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="message">Сообщение</label>
                                <textarea class="form-control" id="message" name="message" required></textarea>
                            </div>

                            <button class="btn btn-primary" type="submit">Отправить</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ФУТЕР -->
    <footer class="py-3 my-0 border-top text-center text-muted bg-dark">
        <p class="mb-0 small">© 2026 Веб-приложение.</p>
    </footer>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
